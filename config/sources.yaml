# News sources for the personalized brief. Edit freely.
# RSS feeds are free and need no API key.
rss_feeds:
  - name: "Yahoo Finance"
    url: "https://finance.yahoo.com/news/rssindex"
  - name: "CNBC Markets"
    url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258"
  - name: "CNBC Technology"
    url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=19854910"
  - name: "Investing.com"
    url: "https://www.investing.com/rss/news.rss"
  - name: "Economic Times Markets"
    url: "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms"

# Filtering
max_age_hours: 36     # ignore older headlines
max_items: 40         # cap total headlines passed to the LLM
# If true, prioritize headlines mentioning watchlist tickers / company names.
prioritize_watchlist: true
